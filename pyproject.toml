[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-ml-fallback"
version = "0.1.0"
description = "Fallback machine-learning proxy for Immich: serves Smart Search text embeddings from precomputed word vectors, with no model loaded."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "orjson>=3.9",
]

[project.optional-dependencies]
# Needed on the Mac only (vector generation and evaluation).
generate = ["httpx>=0.27", "wordfreq>=3.0"]
dev = ["pytest>=8", "httpx>=0.27", "wordfreq>=3.0"]

[project.scripts]
immich-ml-fallback = "immich_ml_fallback.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
immich_ml_fallback = ["resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
